arguments:
  backbone:
    ModelConfig:
      arguments:
        add_global_variables_after_pooling: false
        dynedge_layer_sizes: null
        features_subset: null
        global_pooling_schemes: [max, mean]
        nb_inputs: 4
        nb_neighbours: 32
        post_processing_layer_sizes: [256, 128]
        readout_layer_sizes: [256]
      class_name: DynEdge
  graph_definition:
    ModelConfig:
      arguments:
        columns: [0, 1, 2]
        detector:
          ModelConfig:
            arguments: {}
            class_name: IceTop
        dtype: null
        nb_nearest_neighbours: 32
        node_definition:
          ModelConfig:
            arguments: {}
            class_name: NodesAsPulses
        input_feature_names: [dom_x, dom_y, charge, dom_time]
      class_name: KNNGraph
  optimizer_class: '!class torch.optim.adamw AdamW'
  optimizer_kwargs: {eps: 1e-8, lr: 0.001, weight_decay: 0.01}
  scheduler_class: '!class torch.optim.lr_scheduler ReduceLROnPlateau'
  scheduler_kwargs: {mode: 'min', patience: 5}
  scheduler_config: {monitor: val_loss}
  tasks:
  - ModelConfig:
      arguments:
        hidden_size: 256
        loss_function:
          ModelConfig:
            arguments: {}
            class_name: MSELoss
        loss_weight: null
        prediction_labels: null
        target_labels: energy
        transform_inference: '!lambda x: torch.pow(10,x)'
        transform_prediction_and_target: '!lambda x: torch.log10(x)'
        transform_support: null
        transform_target: null
      class_name: EnergyReconstruction
class_name: StandardModel